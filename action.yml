name: Deploy to Socrat
description: Commit an image version to alchemmist/homelab. Call the reusable workflow instead of this composite action.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "Use the reusable workflow alchemmist/deploy-to-socrat/.github/workflows/deploy.yml." >&2
        echo "A composite action cannot keep the homelab deploy key out of the calling repository." >&2
        exit 1
