name: Deploy to Socrat

on:
  workflow_call:
    inputs:
      app:
        description: Application name. Defaults to the calling repository name.
        required: false
        type: string
        default: ""
      image_version:
        description: Image digest (sha256:...) or tag to commit into homelab.
        required: true
        type: string

jobs:
  commit-image-version:
    name: Commit the image version to homelab
    runs-on: ubuntu-latest
    steps:
      - name: Require the homelab deploy key
        shell: bash
        env:
          HOMELAB_DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${HOMELAB_DEPLOY_KEY:-}" ]]; then
            echo "HOMELAB_DEPLOY_KEY is not available to this workflow." >&2
            exit 1
          fi

      - name: Skip a stale caller commit
        id: stale
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk 'NR == 1 { print $1 }')"
          if [[ -n "$latest" && "$GITHUB_SHA" != "$latest" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Stale build $GITHUB_SHA; ${GITHUB_REF_NAME} is $latest."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out homelab
        if: steps.stale.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: alchemmist/homelab
          path: homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          persist-credentials: true

      - name: Resolve the releaser revision
        if: steps.stale.outputs.skip != 'true'
        id: releaser
        shell: bash
        run: echo "ref=${GITHUB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Check out the releaser
        if: steps.stale.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: alchemmist/deploy-to-socrat
          ref: ${{ steps.releaser.outputs.ref }}
          path: releaser

      - name: Update values and push
        if: steps.stale.outputs.skip != 'true'
        shell: bash
        env:
          APP_INPUT: ${{ inputs.app }}
          IMAGE_VERSION: ${{ inputs.image_version }}
        run: |
          set -euo pipefail
          app="${APP_INPUT:-${GITHUB_REPOSITORY#*/}}"
          git config --global user.name "socrat-releaser"
          git config --global user.email "41898282+socrat-releaser@users.noreply.github.com"
          cd homelab
          git pull --rebase origin main
          python3 "$GITHUB_WORKSPACE/releaser/deploy.py" . "$app" "$IMAGE_VERSION" "$GITHUB_SHA"
          if git diff --quiet; then
            echo "No values change."
            exit 0
          fi
          git add -- "deploy/$app/values.yaml"
          if [[ -f "charts/$app/values.yaml" ]]; then
            git add -- "charts/$app/values.yaml"
          fi
          git commit -m "chore(${app}): deploy ${IMAGE_VERSION}" -m "Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push origin HEAD:main
